name: Release

# Pushing a tag `vX.Y.Z` (matching Cargo.toml's version) builds
# BenCode-arm64.dmg and BenCode-x86_64.dmg and publishes them as a GitHub
# Release, with that version's CHANGELOG.md section as the notes. A tag with
# a hyphen (v0.2.0-beta.1) is a pre-release. Running the workflow by hand only
# builds the dmg and keeps it as a workflow artifact; by default that test
# build is Apple Silicon only with thin LTO, so it finishes much sooner.
# Signing and notarization: docs/releasing.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: Architectures to build
        type: choice
        options:
          - aarch64-apple-darwin
          - aarch64-apple-darwin x86_64-apple-darwin
        default: aarch64-apple-darwin
      quick:
        description: Quick build (thin LTO, parallel codegen; a little bigger and slower)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      SIGNED: ${{ secrets.MACOS_CERTIFICATE != '' }}
      # Auto-update: the release key's two halves (docs/releasing.md).
      UPDATES: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
      HAS_UPDATE_PUBKEY: ${{ vars.BENCODE_UPDATE_PUBKEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit count is the bundle's build number.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Check the tag against Cargo.toml
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml's version $version"
            exit 1
          fi

      - name: Import the signing certificate
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode >"$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Check the update key
        if: env.UPDATES == 'true' || env.HAS_UPDATE_PUBKEY == 'true'
        run: |
          if [[ "$UPDATES" != true || "$HAS_UPDATE_PUBKEY" != true ]]; then
            echo "::error::Set both the MINISIGN_SECRET_KEY secret and the BENCODE_UPDATE_PUBKEY variable, or neither"
            exit 1
          fi
          brew list minisign >/dev/null 2>&1 || brew install minisign

      - name: Build the disk images
        env:
          BENCODE_UPDATE_PUBKEY: ${{ vars.BENCODE_UPDATE_PUBKEY }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # A tag builds both architectures, fully optimized; a manual run
          # takes the inputs above.
          TARGETS: ${{ inputs.targets || 'aarch64-apple-darwin x86_64-apple-darwin' }}
          CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick == false && 'fat' || 'thin' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick == false && '1' || '16' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BenCode-${{ steps.version.outputs.version }}
          path: |
            target/bundle/BenCode-*.dmg
            target/bundle/BenCode-*.dmg.sha256
            target/bundle/BenCode-*.app.tar.gz
            target/bundle/BenCode-*.app.tar.gz.minisig
            target/bundle/latest.json
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          # This version's section of CHANGELOG.md: from its "## [x.y.z]"
          # heading to the next "## ".
          awk -v v="[$VERSION]" '/^## /{ on = index($0, v) > 0; next } on' CHANGELOG.md >"$notes"
          flags=()
          if [[ ! -s "$notes" ]]; then
            # No CHANGELOG section: list the commits instead.
            flags+=(--generate-notes)
          fi
          cat >>"$notes" <<'EOF'

          ### Downloads

          - **Apple Silicon** (M1 and later): `BenCode-arm64.dmg`
          - **Intel**: `BenCode-x86_64.dmg`
          EOF
          if [[ "$SIGNED" != true ]]; then
            cat >>"$notes" <<'EOF'

          ### First launch

          This build is not notarized by Apple, so macOS asks you to confirm it once:
          open BenCode, then go to **System Settings › Privacy & Security** and click
          **Open Anyway**. If macOS says the app "is damaged", run:

          ```sh
          xattr -dr com.apple.quarantine /Applications/BenCode.app
          ```
          EOF
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          assets=(target/bundle/BenCode-*.dmg target/bundle/BenCode-*.dmg.sha256)
          # The update archives and the feed the app checks (latest.json is
          # read from the newest release, so it ships with every one).
          if [[ "$UPDATES" == true ]]; then
            assets+=(target/bundle/BenCode-*.app.tar.gz target/bundle/BenCode-*.app.tar.gz.minisig target/bundle/latest.json)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "BenCode $VERSION" --notes-file "$notes" --verify-tag "${flags[@]}"
