name: Pages

# Publishes site/ (the landing page) to GitHub Pages. One-time setup: in the
# repository's Settings › Pages, set Source to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packaging/macos/icon.svg'
      - 'packaging/macos/icon-1024.png'
      - 'docs/assets/readme/**'
      - 'assets/providers/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # site/icon.*, shots and providers are symlinks; copy what they point at.
      - name: Assemble
        run: cp -RL site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
