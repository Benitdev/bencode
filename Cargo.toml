[package]
name = "bencode"
version.workspace = true
edition = "2024"
license = "MIT"
description = "A native GPU-accelerated control plane for MonoCode using Rust and Ely GPUI"

[workspace.package]
# One version for the app, its host and what they share: Settings ›
# Connections installs the host of the app's own version.
version = "0.1.22"

[workspace]
members = [".", "crates/bencode-core", "crates/bencode-host"]
default-members = [".", "crates/bencode-core", "crates/bencode-host"]

[dependencies]
# What the app shares with its remote host: the agent CLIs, the protocol.
bencode-core = { path = "crates/bencode-core" }

# Ely GPUI Component Library
# repository (ZacharyZhang-NY/Ely-GPUI-Components) is gone from GitHub.
# Pinned: later Ely commits change ThemeSelector / SettingsLayout (ad47249).
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }

# Async runtime & Utilities
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
anyhow = "1"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# SQLite reader for MonoCode's database
rusqlite = { version = "0.33", features = ["bundled"] }
jiff = "0.2"

# The transcript's markdown (the versions Ely already builds)
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"

# The chat background's decoding and effects (the version GPUI already builds)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# The footer's CPU and memory readout (getrusage, proc_pid_rusage)
libc = "0.2"

# The in-app browser's WKWebView (browser/page.rs): the version Ely already
# builds for its WebView; `devtools` turns on Web Inspector.
wry = { version = "0.57", default-features = false, features = ["devtools"] }

# Checks an update's signature against the release key (updater.rs); what
# tauri-plugin-updater uses for MonoCode, with no dependencies of its own.
minisign-verify = "0.2"

# The terminal host's copy of each shell's screen (pty_host/screen.rs): the
# emulator Ely's terminal is built on, at the version it already builds.
alacritty_terminal = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
# Completion handlers for UNUserNotificationCenter (notifications.rs); the
# version cocoa already builds.
block = "0.1"
# The window's NSView, for the Liquid Glass under it (ui/native_glass.rs);
# the version GPUI already builds.
raw-window-handle = "0.6"

# The shipped binary: whole-program LTO and no symbols take it from 33 MB to
# about 22 MB at the same speed, for a release build about twice as long.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# A fifth smaller (29MB to 24MB); the panic hook still logs the backtrace.
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
