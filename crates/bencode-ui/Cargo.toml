[package]
name = "bencode-ui"
version.workspace = true
edition = "2024"
license = "MIT"
description = "BenCode's components, adapted from Ely GPUI Components (see NOTICE)."
publish = false

[features]
default = ["runtime_shaders"]
# Shaders compiled when the window opens: building them ahead needs Xcode's
# `metal`, which the Command Line Tools lack (as Ely did).
runtime_shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
anyhow = "1"
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
image = { version = "0.25", default-features = false }
jiff = "0.2"
log = "0.4"
markdown = "=1.0.0"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
regex = "1"
rust-embed = "8.12"
smallvec = "1"
unicode-segmentation = "1"
usvg = "0.46"
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }
web-time = "1.1"
alacritty_terminal = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa = "0.26"
objc = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
env_logger = "0.11"
# The tests render with GPUI's test app.
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker", "test-support", "leak-detection"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
